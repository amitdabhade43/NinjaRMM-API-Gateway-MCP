[project]
name = "ninjaone-api-gateway-mcp"
version = "0.3.0"
description = "Schema-driven NinjaOne API Gateway MCP with grounded semantic discovery"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.3.0",
    "httpx>=0.28.0",
    "rapidfuzz>=3.6",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.22"]

[project.scripts]
ninjaone-api-gateway = "ninja_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ninja_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
